services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: 'Y'
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: '${MSSQL_SA_PASSWORD:?Copia .env.example a .env}'
    volumes:
      - sql-data:/var/opt/mssql
    healthcheck:
      test: ['CMD-SHELL', 'SQLCMDPASSWORD="$$MSSQL_SA_PASSWORD" /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -C -b -Q "SELECT 1" -o /dev/null']
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 20s

  api:
    build:
      context: .
      dockerfile: backend/SISReservas.Api/Dockerfile
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: '8080'
      AppBaseUrl: 'http://localhost:${APP_PORT:-5054}'
      ConnectionStrings__DefaultConnection: 'Server=sqlserver,1433;Database=SISReservasEspacios;User ID=sa;Password="${MSSQL_SA_PASSWORD:?Copia .env.example a .env}";Encrypt=True;TrustServerCertificate=True;'
      Database__ApplyMigrations: 'true'
      Documentos__Directorio: /app/data/documentos
      EmailDispatcher__Enabled: '${EmailDispatcher__Enabled:-true}'
      WEATHER_API_KEY: '${WEATHER_API_KEY:-}'
      WEATHER_LOCATION: '${WEATHER_LOCATION:-18.4861,-69.9312}'
      SMTP_HOST: '${SMTP_HOST:-mailpit}'
      SMTP_PORT: '${SMTP_PORT:-1025}'
      SMTP_FROM: '${SMTP_FROM:-reservas@test.invalid}'
      SMTP_ENABLE_SSL: '${SMTP_ENABLE_SSL:-false}'
      SMTP_USE_AUTH: '${SMTP_USE_AUTH:-false}'
      SMTP_USERNAME: '${SMTP_USERNAME:-}'
      SMTP_PASSWORD: '${SMTP_PASSWORD:-}'
    ports:
      - '127.0.0.1:${APP_PORT:-5054}:8080'
    volumes:
      - documentos-data:/app/data/documentos

  mailpit:
    image: axllent/mailpit:v1.33.0

  mail-inspector:
    image: curlimages/curl:8.17.0
    profiles: [inspeccion-correo]

volumes:
  sql-data:
  documentos-data:
